# Weekly update pull requests, one for the minor and patch updates of each ecosystem. Major updates
# come one pull request apiece. Dependabot opens them against the default branch; CI checks them
# like any other change. The GitHub Actions are pinned by commit, and this keeps those pins moving.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /core
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      uv:
        update-types: [minor, patch]
