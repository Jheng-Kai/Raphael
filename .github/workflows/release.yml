name: Build Windows release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified assets to the version's GitHub Release
        type: boolean
        default: false
      release_notes:
        description: Owner-reviewed release notes included in the updater feed
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The frontend, Python and Rust suites took 38 of the 51 minutes of the v1.1.0 release and now take about 53
  # on one machine, which leaves a 60-minute release job no room for the build. CI runs them (the Python suite on eight machines), so a release asks for a green CI
  # run on this exact commit instead of repeating them. Only the release-only work stays below: the
  # frozen core and its smoke test, the installer, signing, checksums and the install check.
  ci-gate:
    name: Require a green CI run on this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Find a passing CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Jheng-Kai/Raphael
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # A push run on main only checks the Rust dependencies, so it never counts. Pull request,
          # manual and merge queue runs check all three layers, and then "Guardian required gates" passes.
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$COMMIT&status=completed&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .event != "push") | .id')
          for id in $runs; do
            gate=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Guardian required gates" and .conclusion == "success")] | length')
            if [ "$gate" = "1" ]; then
              echo "CI run $id passed every gate on $COMMIT."
              exit 0
            fi
          done
          echo "::error::No green CI run exists for commit $COMMIT. Run the CI workflow on this commit first (Actions > CI > Run workflow, on this branch or tag), wait for it to pass, then start the release again."
          exit 1

  windows-release:
    name: Build and verify Windows installer
    needs: ci-gate
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTUP_TOOLCHAIN: "1.98.0"
      RAPHAEL_TEST_MODELS: "0"
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check release inputs
        run: |
          if ($env:GITHUB_REPOSITORY -ne 'Jheng-Kai/Raphael') { throw 'Release builds must use Jheng-Kai/Raphael.' }
          $excluded = @('models', 'voice', 'raphael_ref', '.superpowers', 'ui-shots', 'eval/data')
          foreach ($path in $excluded) {
            if (Test-Path -LiteralPath $path) { throw "Unexpected release input: $path" }
          }

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # app/package.json, tauri.conf.json, Cargo.toml and core/pyproject.toml must carry the same x.y.z.
      - name: Check release versions
        id: version
        working-directory: app
        run: |
          $version = node scripts/check-release-version.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      # Artifacts of different refs and commits must not share a name. Characters that an artifact name
      # forbids, such as the slash in a branch name, become hyphens.
      - name: Name the artifact after its source
        id: identity
        run: |
          $ref = ($env:GITHUB_REF_NAME -replace '[^A-Za-z0-9._-]', '-').Trim('-')
          "artifact-name=Raphael-windows-x64-$ref-$($env:GITHUB_SHA.Substring(0, 12))" >> $env:GITHUB_OUTPUT

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.11"
          working-directory: core
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version

      # No Rust cache here: CI caches its builds, a release is compiled from scratch.
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Install locked Python build dependencies
        working-directory: core
        run: |
          uv python install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group packaging

      - name: Freeze Python core
        working-directory: core
        run: uv run --locked --no-sync python packaging/build.py

      - name: Verify frozen core
        working-directory: core
        run: uv run --locked --no-sync python packaging/smoke.py --core dist/raphael-core/raphael-core.exe

      - name: Collect dependency notices
        working-directory: app
        run: node scripts/collect-release-notices.mjs

      - name: Check Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Build Windows installer
        id: build
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RAPHAEL_UPDATER_PUBLIC_KEY: ${{ secrets.RAPHAEL_UPDATER_PUBLIC_KEY }}
        run: |
          $config = @('--config', 'src-tauri/tauri.release.conf.json')
          if ($env:TAURI_SIGNING_PRIVATE_KEY -and $env:RAPHAEL_UPDATER_PUBLIC_KEY) {
            "updater=signed" >> $env:GITHUB_OUTPUT
          } else {
            "updater=disabled" >> $env:GITHUB_OUTPUT
            Write-Output "::warning::Updater feed was skipped because the owner's signing keys are not set."
            $config += @('--config', 'src-tauri/tauri.release-no-updater.conf.json')
            Remove-Item Env:TAURI_SIGNING_PRIVATE_KEY, Env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD, Env:RAPHAEL_UPDATER_PUBLIC_KEY -ErrorAction SilentlyContinue
          }
          node scripts/tauri.mjs build @config --bundles nsis --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Bind the artifact version in the signed trusted comment; the runtime rejects replayed bytes.
      - name: Sign updater artifact with its version
        if: steps.build.outputs.updater == 'signed'
        working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          node scripts/tauri.mjs signer sign --app-version $env:RELEASE_VERSION $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installed application
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          ./app/scripts/verify-windows-install.ps1 -Installer $installers[0].FullName -Python "$pwd/core/.venv/Scripts/python.exe"

      # The installer, the notices, BUILD-INFO.txt (commit, ref, run and tools) and SHA256SUMS.txt for all of them.
      - name: Prepare release assets and checksums
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
          UPDATER_MODE: ${{ steps.build.outputs.updater }}
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $signature = @()
          if ($env:UPDATER_MODE -eq 'signed') { $signature = @('--signature', "$($installers[0].FullName).sig") }
          node app/scripts/prepare-release-assets.mjs `
            --installer $installers[0].FullName `
            --updater $env:UPDATER_MODE @signature `
            --notices app/src-tauri/release-notices/THIRD_PARTY_NOTICES.txt `
            --version $env:RELEASE_VERSION `
            --output release-assets

      # The same check a downloader runs; it fails on CRLF line endings.
      - name: Check release asset checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified release assets
    needs: windows-release
    if: ${{ inputs.publish && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows-release.outputs.artifact-name }}
          path: release-assets
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Jheng-Kai/Raphael
          RELEASE_VERSION: ${{ needs.windows-release.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          cd release-assets
          sha256sum --check --strict SHA256SUMS.txt
          version="$RELEASE_VERSION"
          # An existing tag must resolve to the exact source that built these assets.
          tag_ref=$(gh api "repos/$GH_REPO/git/matching-refs/tags/v$version" --jq ".[] | select(.ref == \"refs/tags/v$version\") | .ref")
          if [ -n "$tag_ref" ]; then
            tag_commit=$(gh api "repos/$GH_REPO/commits/v$version" --jq .sha)
            if ! [ "$tag_commit" = "$RELEASE_COMMIT" ]; then
              echo "Release tag does not match the built commit." >&2
              exit 1
            fi
          fi
          gh release create "v$version" ./* --target "$RELEASE_COMMIT" --title "Raphael $version" --generate-notes

  # Provenance only for what is published from main or a tag, and only where GitHub offers artifact
  # attestations: public repositories (private ones need GitHub Enterprise Cloud). This job alone gets
  # the two token scopes attestation needs; it checks out nothing and builds nothing.
  attest:
    name: Attest build provenance
    needs: windows-release
    if: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download the verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows-release.outputs.artifact-name }}
          path: release-assets

      - name: Check release asset checksums
        working-directory: release-assets
        run: sha256sum --check --strict SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
