name: CI

# Every PR and merge-queue entry checks the repository contracts and the offline suites of all
# three layers. The rendered UI matrix and the design judge run locally, never here.
on:
  push:
    branches: [main]
    paths:
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/Cargo.toml"
      - "app/src-tauri/vendor/handy-keys/Cargo.toml"
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Choose the jobs to run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.pick.outputs.frontend }}
      python: ${{ steps.pick.outputs.python }}
      rust: ${{ steps.pick.outputs.rust }}
      packaging: ${{ steps.packaging.outputs.packaging }}
    steps:
      - name: Pick the layers for this event
        id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          out() { echo "frontend=$1" >> "$GITHUB_OUTPUT"; echo "python=$2" >> "$GITHUB_OUTPUT"; echo "rust=$3" >> "$GITHUB_OUTPUT"; echo "frontend=$1 python=$2 rust=$3"; }
          case "$EVENT" in
            workflow_dispatch|merge_group) out true true true; exit 0 ;;
            push) out false false true; exit 0 ;;  # only the Rust dependencies start a push run
          esac
          # Every PR checks repository contracts and all three implementation layers.
          out true true true

      # The three layers above always run. The frozen-core smoke test is slower and needs a Windows
      # build, so it runs only when the change can break the freeze.
      - name: Does the change touch the Python packaging
        id: packaging
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          hit=false
          case "$EVENT" in
            push) ;;
            pull_request)
              files=$(gh api "repos/$GH_REPO/pulls/$PULL_REQUEST/files" --paginate --jq '.[].filename')
              for file in $files; do
                case "$file" in core/packaging/*|core/pyproject.toml|core/uv.lock|core/.python-version) hit=true; break ;; esac
              done ;;
            *) hit=true ;;
          esac
          echo "packaging=$hit" >> "$GITHUB_OUTPUT"
          echo "packaging=$hit"

  frontend:
    name: Frontend tests and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Verify frontend, product rules and architecture
        run: npm run verify

      - name: Type-check and build frontend
        run: npm run build

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-verify-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/.look/verify-*/*
          if-no-files-found: error
          # The verify folder starts with a dot, which the action leaves out unless told.
          include-hidden-files: true
          retention-days: 14

  # One machine took 42 minutes over the suite, so eight share it. conftest deals whole test files
  # to the shares (keep_this_share); the required gate passes only when every share does.
  python:
    name: Python tests (${{ matrix.share }} of 8)
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      # Every share reports, so one red run names all the failures.
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: pwsh
        working-directory: core
    env:
      RAPHAEL_TEST_MODELS: "0"
      # Subprocesses also fail closed; conftest installs a fresh memory keyring per test.
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
      RAPHAEL_TEST_SHARE: ${{ matrix.share }}/8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.11"
          working-directory: core
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version

      - name: Install pinned Python
        run: uv python install

      - name: Install locked Python dependencies
        run: uv sync --locked --dev

      # The slowest tests are listed so the next thing to speed up is named in the log.
      # Each machine also writes the seconds of the files it ran. conftest deals the files by the
      # record in core/tests/shard-durations.json; core/tests/shard_durations.py says how to refresh it
      # from these artifacts.
      - name: Run Python tests with warnings denied
        env:
          RAPHAEL_RECORD_DURATIONS: durations-out/share-${{ matrix.share }}.json
        run: uv run --locked --no-sync pytest -q -ra -W error --durations=25 --durations-min=2

      - name: Upload the seconds of this share
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-durations-${{ matrix.share }}
          path: core/durations-out/share-${{ matrix.share }}.json
          if-no-files-found: warn
          retention-days: 14

  windows-shell:
    name: Windows Rust and Tauri shell
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: app/src-tauri
    env:
      # The hosted Windows runner is expected to have 4 cores, which a Rust build has to itself.
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTUP_TOOLCHAIN: "1.98.0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for files that must not be committed
        working-directory: .
        run: |
          $excluded = @("models", "voice", "raphael_ref", ".superpowers", "ui-shots", "eval/data")
          foreach ($path in $excluded) {
            if (Test-Path -LiteralPath $path) {
              throw "The checkout must not contain: $path"
            }
          }

      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      # main's cache is the fallback for every pull request; a pull request also saves its own,
      # which only its later runs can restore, so they skip the dependencies it changed.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            app/src-tauri -> target
            app/src-tauri/vendor/handy-keys -> target
          cache-bin: false
          save-if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: app
        run: npm ci

      # This runs beforeBuildCommand, embeds the real frontend, and links the Windows executable.
      - name: Build Tauri debug application
        working-directory: app
        run: node scripts/tauri.mjs build --debug --no-bundle --ci -- --locked

      - name: Run Rust tests
        run: cargo test --locked

      # The patched keyboard listener is a path dependency, so its tests need a separate run.
      - name: Run vendored keyboard listener unit tests
        run: cargo test --locked --lib --manifest-path vendor/handy-keys/Cargo.toml

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

  # The frozen core builds and starts from the PyInstaller bundle, as in a release. It is not one of
  # the required gates: it runs only for changes that can break the freeze (see above).
  packaging:
    name: Frozen core smoke test
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: core
    env:
      RAPHAEL_TEST_MODELS: "0"
      PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.11"
          working-directory: core
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            .python-version

      - name: Install pinned Python and the packaging dependencies
        run: |
          uv python install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv sync --locked --group packaging

      - name: Freeze Python core
        run: uv run --locked --no-sync python packaging/build.py

      - name: Verify frozen core
        run: uv run --locked --no-sync python packaging/smoke.py --core dist/raphael-core/raphael-core.exe

  required:
    name: Guardian required gates
    needs: [changes, frontend, python, windows-shell]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every implementation gate
        env:
          FRONTEND: ${{ needs.frontend.result }}
          PYTHON: ${{ needs.python.result }}
          RUST: ${{ needs.windows-shell.result }}
        run: |
          test "$FRONTEND" = success
          test "$PYTHON" = success
          test "$RUST" = success
