<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raphael overlay</title>
    <style>
      /* The overlay window is transparent and click-through: keep the page transparent from the
         first paint, before overlay.css has loaded. */
      html,
      body {
        margin: 0;
        background: transparent;
      }
    </style>
    <link rel="stylesheet" href="/src/overlay/overlay.css" />
  </head>

  <body>
    <canvas id="emblem" aria-hidden="true"></canvas>
    <!-- The person's picture over the emblem's circle, when they chose one (emblem.ts, setPicture). -->
    <span id="picture" aria-hidden="true" hidden><img alt="" draggable="false" /></span>
    <div id="progress" class="progress" hidden></div>
    <div id="subtitles" class="subs" aria-live="polite">
      <div class="sub-line"></div>
    </div>
    <!-- The buttons of a question (an `ask` event), under its line: no, always (only a question with the
         third answer), yes. Their words come from the event. -->
    <button type="button" id="overlay-stop" class="btn task-action" hidden></button>
    <div id="ask" class="ask ask-card" role="region" aria-labelledby="ask-title" hidden>
      <h2 id="ask-title" class="ask-title"></h2>
      <div id="ask-details" class="ask-details"></div>
      <button type="button" id="ask-expand" class="btn sm" aria-controls="ask-details" aria-expanded="false" hidden></button>
      <div class="ask-actions">
      <button type="button" id="ask-no" class="btn ask-btn ask-no"></button>
      <button type="button" id="ask-always" class="btn ask-btn ask-always" hidden></button>
      <button type="button" id="ask-yes" class="btn pri ask-btn ask-yes">
        <span class="ask-label"></span>
      </button>
      </div>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </body>
</html>
